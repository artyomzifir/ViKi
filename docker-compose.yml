x-common: &common
  build:
    context: .
    dockerfile: docker/Dockerfile
  network_mode: host
  privileged: true
  volumes:
    - ./tools:/app/tools
    - ./data:/app/data
    - /dev:/dev
    - /run/udev:/run/udev:ro
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ./viki:/app/viki
    - ./pyproject.toml:/app/pyproject.toml:ro
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app
    - DISPLAY=${DISPLAY}
    - LIBGL_ALWAYS_SOFTWARE=1
    - GALLIUM_DRIVER=llvmpipe
  devices:
    - /dev/dri:/dev/dri

services:
  viki:
    <<: *common
    container_name: viki
    restart: unless-stopped
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["uvicorn", "viki.server.app:app", "--host", "0.0.0.0", "--port", "8000"]

  terminal:
    <<: *common
    container_name: viki-terminal
    stdin_open: true
    tty: true
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["/bin/bash"]
    restart: "no"
    profiles:
      - tools
