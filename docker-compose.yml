# Single compose file. One image (Dockerfile `test` target = base + pytest),
# four services:
#
#   web       docker compose up                       -> FastAPI on :8000
#   test      docker compose run --rm test [args]      -> pytest tests/ (args append)
#   cli       docker compose run --rm cli <verb> ...   -> `viki <verb> ...`
#   terminal  docker compose run --rm terminal         -> bash, for manual poking
#
# Only `web` starts on `up`; the rest sit behind the `tools` profile and are
# meant for `run`.

x-common: &common
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: test
  image: viki
  network_mode: host
  gpus: all                      # host NVIDIA GPU for model inference (nvidia-container-toolkit)
  # ── resource ceilings ──────────────────────────────────────────────────────
  # The box is 16 core / 15 GiB / 4 GiB swap. Without caps a runaway (an
  # unpinned BLAS solve, a leak) takes the bare host down and systemd-oomd kills
  # a random cgroup — often dockerd or the desktop session, and USB drops from
  # IRQ starvation. Cap the container so it OOM-kills *itself* and the host keeps
  # headroom for Xorg / USB / ssh.
  mem_limit: 11g
  memswap_limit: 11g             # == mem_limit ⇒ no swap thrashing
  cpus: "12"
  pids_limit: 512
  oom_score_adj: 800             # if something must die under pressure, it's us
  # ── device access without full privilege ──────────────────────────────────
  # was `privileged: true` + `/dev:/dev`. Cameras need libusb (/dev/bus/usb) and
  # the k4a depth engine needs /dev/dri; nothing needs to touch xhci, usbcore
  # params, or the rest of the host. SYS_NICE: k4a raises capture-thread priority.
  cap_add:
    - SYS_NICE
  device_cgroup_rules:
    - "c 189:* rwm"              # usb (usbfs / usb-serial)
    - "c 226:* rwm"              # dri (render + card nodes)
    - "c 81:* rwm"               # v4l, in case a backend opens a video node
  volumes:
    - /dev/bus/usb:/dev/bus/usb  # dynamic — new/re-enumerated nodes show through
    - /run/udev:/run/udev:ro
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ./viki:/app/viki
    - ./tests:/app/tests
    - ./data:/app/data
    - ./scripts:/app/scripts
    - ./models:/app/models
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app
    - GIT_PYTHON_REFRESH=quiet
    - DISPLAY=${DISPLAY}
    # Cap BLAS/OpenMP so no single numpy/scipy stage (hand_fit lsmr, retarget IK)
    # pegs every core — read at library load, so this is the reliable lever.
    # hand_fit's window pool pins to 1/worker on top of this (threadpoolctl).
    - OMP_NUM_THREADS=6
    - OPENBLAS_NUM_THREADS=6
    - MKL_NUM_THREADS=6
    - NUMEXPR_NUM_THREADS=6
    # LIBGL_ALWAYS_SOFTWARE governs GL *rendering* (k4a depth engine, viewer),
    # NOT CUDA compute — leave it; RTMPose's CUDA EP is unaffected.
    - LIBGL_ALWAYS_SOFTWARE=1
    - GALLIUM_DRIVER=llvmpipe
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  devices:
    - /dev/dri:/dev/dri

services:
  web:
    <<: *common
    container_name: viki-web
    restart: unless-stopped
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["uvicorn", "viki.server.app:app", "--host", "0.0.0.0", "--port", "8000"]

  test:
    <<: *common
    container_name: viki-test
    restart: "no"
    profiles: ["tools"]
    entrypoint: ["/app/docker/entrypoint.sh", "pytest"]
    command: ["tests/", "-q"]

  cli:
    <<: *common
    container_name: viki-cli
    restart: "no"
    profiles: ["tools"]
    entrypoint: ["/app/docker/entrypoint.sh", "viki"]
    command: ["--help"]

  terminal:
    <<: *common
    container_name: viki-terminal
    restart: "no"
    profiles: ["tools"]
    stdin_open: true
    tty: true
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["/bin/bash"]
