<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViKi</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

  <header>
    <div class="dot grey" id="server-dot"></div>
    <h1>ViKi</h1>

    <div class="cam-cluster">
      <button data-action="scanDevices">⟳ Scan</button>
      <button data-action="startAll">▶ Start all</button>
      <button class="danger" data-action="stopAll">■ Stop all</button>
      <div id="camera-pills" class="camera-pills"></div>
    </div>

    <div class="header-right">
      <button class="log-toggle" data-action="toggleLog" title="Show log">▸</button>
      <div class="log-line" id="log-line"></div>
      <button class="gear" data-action="toggleConfig" title="Configuration">⚙</button>
    </div>
  </header>

  <nav id="tabbar">
    <button data-action="showTab" data-tab="calibration">Calibration</button>
    <button data-action="showTab" data-tab="record">Record</button>
    <button data-action="showTab" data-tab="extract">Extract</button>
    <button data-action="showTab" data-tab="prepare">Prepare</button>
    <button data-action="showTab" data-tab="retarget">Retarget</button>
    <button data-action="showTab" data-tab="replay">Replay</button>
    <button data-action="showTab" data-tab="export">Export</button>
    <button data-action="showTab" data-tab="viewer">Viewer</button>
  </nav>

  <main id="view"></main>

  <div id="log-popover" hidden>
    <div class="log-popover-head">
      <span>Log</span>
      <button data-action="toggleLog">✕</button>
    </div>
    <div class="log-list"></div>
  </div>

  <div id="config-modal" hidden>
    <div class="cfg-dialog">
      <div class="cfg-head">
        <span class="title">Server Configuration</span>
        <button data-action="cfgClose">✕</button>
      </div>
      <div class="cfg-body"></div>
      <div class="cfg-banner" hidden>Restart required to apply changes.</div>
      <div class="cfg-foot">
        <button data-action="cfgReset">Reset to defaults</button>
        <button class="primary" data-action="cfgSave">Save</button>
        <button class="danger" data-action="cfgRestart">Restart server</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>

</html>
